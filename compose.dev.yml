# Local development database ONLY. Not a deployment artifact.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: beacon
      POSTGRES_USER: beacon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beacon}
    # Host port 5434 (not the default 5432): this machine already has a
    # native Postgres server bound to 5432. The container still listens
    # on 5432 internally.
    ports:
      - "5434:5432"
    volumes:
      - beacon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beacon -d beacon"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  beacon_pgdata:
    name: beacon_pgdata
