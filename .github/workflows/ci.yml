name: ci

# Checks for changes to the pipeline itself: every PR into main (where all
# workflows live) is linted before it can merge. The "Lint workflows" check is
# required by main's branch protection.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # actionlint also runs shellcheck (preinstalled on the runner) over every
      # run: script.
      - name: actionlint
        run: |
          bash <(curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "${ACTIONLINT_VERSION}"
          ./actionlint -version
          ./actionlint -color
