name: rollback
run-name: >-
  ${{ inputs.dry_run && 'dry-run ' || '' }}rollback ${{ inputs.environment }} to
  ${{ inputs.sha != '' && format('commit {0}', inputs.sha) || (inputs.version != '' && inputs.version || 'previous release') }}

# Roll an environment back to an earlier release (docs/CLOUD-DEVOPS-DESIGN.md
# §4.3, §7.2): point release-version at it, replace instances, smoke test.
#
# Target: a commit SHA (mapped to its release), a release version, or, by
# default, the release that ran before the current one.
#
# Rules, enforced by scripts/deploy/resolve-rollback.sh before anything changes:
#   1. published  the target is a complete release in the releases bucket
#   2. proven     the target has run in this environment before
#                 (override: allow_unproven, dev only)
#   3. schema     if migrations differ between the running release and the
#                 target, the target must be the previous release
#                 (override: allow_schema_change)
#   A reason is required and recorded in the job summary with who ran it.
#   dry_run checks everything and changes nothing.
#
# Also: manual dispatch with no PR (during an incident a PR is friction, not
# safety), gated by the Environment's required reviewer on stage and prod; never
# runs migrations; shares the deploy queue; if the rollout fails, the release
# pointer goes back to the current release.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to roll back"
        type: choice
        options: [dev, stage, prod]
        default: dev
      reason:
        description: "Why (required; recorded in the run summary)"
        type: string
        required: true
      sha:
        description: "Roll back to the release built from this commit (full or short SHA)"
        type: string
        default: ""
      version:
        description: "Or: roll back to this release version (leave both empty for the previous release)"
        type: string
        default: ""
      dry_run:
        description: "Only check the rules and show what would happen"
        type: boolean
        default: false
      allow_schema_change:
        description: "Override: allow a target older than the previous release across a migration change"
        type: boolean
        default: false
      allow_unproven:
        description: "Override (dev only): allow a target that never ran in this environment"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

# Shares the deploy queue: never runs alongside a deploy to the same environment.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  rollback:
    name: ${{ inputs.dry_run && 'Dry-run rollback' || 'Roll back' }} ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.smoke.outputs.url }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      REASON: ${{ inputs.reason }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Check inputs
        run: |
          if [ -z "$(printf '%s' "${REASON}" | tr -d '[:space:]')" ]; then
            echo "::error::A reason is required."
            exit 1
          fi

      # Full history: SHA lookup and the schema comparison need every commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.environment }}
          fetch-depth: 0
          persist-credentials: false

      - name: Load project config
        run: |
          while IFS='=' read -r key value; do
            case "${key}" in ''|'#'*) continue ;; esac
            echo "${key}=${value}" >> "$GITHUB_ENV"
          done < infra/project.env

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: rollback-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Check rollback rules
        id: resolve
        env:
          TARGET_SHA: ${{ inputs.sha }}
          TARGET_VERSION: ${{ inputs.version }}
          ALLOW_SCHEMA_CHANGE: ${{ inputs.allow_schema_change }}
          ALLOW_UNPROVEN: ${{ inputs.allow_unproven }}
          REPORT_FILE: ${{ runner.temp }}/rollback-report.md
        run: scripts/deploy/resolve-rollback.sh >> "$GITHUB_OUTPUT"

      # If the refresh fails, rollout.sh points release-version back at the
      # current release, so the environment is left as it was.
      - name: Roll out
        if: inputs.dry_run == false
        env:
          TARGET: ${{ steps.resolve.outputs.target_version }}
          CURRENT: ${{ steps.resolve.outputs.current_version }}
        run: scripts/deploy/rollout.sh "${TARGET}" "${CURRENT}"

      - name: Smoke test
        id: smoke
        if: inputs.dry_run == false
        run: scripts/deploy/smoke-test.sh >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        env:
          TARGET: ${{ steps.resolve.outputs.target_version }}
          TARGET_SHA: ${{ steps.resolve.outputs.target_sha }}
          CURRENT: ${{ steps.resolve.outputs.current_version }}
          CURRENT_SHA: ${{ steps.resolve.outputs.current_sha }}
          URL: ${{ steps.smoke.outputs.url }}
          OUTCOME: ${{ job.status }}
          ACTOR: ${{ github.actor }}
          REPORT_FILE: ${{ runner.temp }}/rollback-report.md
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            title="dry-run rollback ${ENVIRONMENT}: ${OUTCOME} (nothing changed)"
          else
            title="rollback ${ENVIRONMENT}: ${OUTCOME}"
          fi
          {
            echo "### ${title}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| From | \`${CURRENT:-unknown}\` (commit \`${CURRENT_SHA:0:7}\`) |"
            echo "| To | \`${TARGET:-unresolved}\` (commit \`${TARGET_SHA:0:7}\`) |"
            echo "| Requested by | @${ACTOR} |"
            echo "| Reason | ${REASON//|/\\|} |"
            [ -n "${URL}" ] && echo "| URL | ${URL} |"
            echo
            [ -s "${REPORT_FILE}" ] && cat "${REPORT_FILE}"
          } >> "$GITHUB_STEP_SUMMARY"
