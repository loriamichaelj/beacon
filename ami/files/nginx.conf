# Beacon host Nginx (docs/CLOUD-DEVOPS-DESIGN.md §6.4). Baked into the AMI.
#
# The ALB terminates TLS and forwards plain HTTP on port 80. Nginx serves the
# SPA from /var/www/beacon and proxies the API and probes to the backend
# container on 127.0.0.1:8000, so the browser only ever talks to one origin
# and CORS stays off.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" $request_time';
    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    server_tokens      off;
    types_hash_max_size 4096;

    # Longer than the ALB's 60s idle timeout, so the ALB always closes idle
    # connections first (otherwise it can reuse one Nginx just closed -> 502).
    keepalive_timeout  75s;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream beacon_api {
        server 127.0.0.1:8000;
        keepalive 16;
    }

    server {
        listen      80 default_server;
        server_name _;
        root        /var/www/beacon;

        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   X-Request-ID $http_x_request_id;

        # Prometheus metrics are for on-host scraping only, never via the ALB.
        location = /metrics {
            return 404;
        }

        location /api/ {
            proxy_pass http://beacon_api;
        }

        # Liveness / readiness: the ALB target group health check hits /readyz.
        location = /healthz {
            proxy_pass http://beacon_api;
        }

        location = /readyz {
            proxy_pass http://beacon_api;
        }

        # Vite emits content-hashed filenames under /assets, safe to cache forever.
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # SPA fallback: any other path is a client-side route.
        location / {
            try_files $uri /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
